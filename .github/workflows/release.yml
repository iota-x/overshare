name: Build installers

# PyInstaller can't cross-compile, so each installer is built on its own OS.
# Push a tag (v1.0.0) to cut a release, or run this by hand to get artifacts
# without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS .dmg
    runs-on: macos-14        # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        id: version
        run: |
          ref="${GITHUB_REF_NAME}"
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] && echo "value=${ref#v}" >> "$GITHUB_OUTPUT" \
                                              || echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the build
        # Otherwise the packaged app has no idea what it is, and the in-app
        # update check has nothing to compare against.
        #
        # Passed through the environment rather than a temp file: Git Bash on
        # the Windows runner and the Python it launches do not agree on where
        # /tmp is, so a file written by one wasn't there for the other.
        shell: python
        env:
          OVERSHARE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          import os, pathlib
          v = os.environ["OVERSHARE_VERSION"]
          p = pathlib.Path("overshare/version.py")
          t = p.read_text()
          new = f'VERSION = "{v}"'
          assert 'VERSION = "0.0.0-dev"' in t, "placeholder already replaced?"
          p.write_text(t.replace('VERSION = "0.0.0-dev"', new))
          print("stamped:", new)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the app
        run: pyinstaller packaging/Overshare.spec --noconfirm

      # --- Signing (dormant until the secrets exist) -----------------------
      # Without them the build still succeeds and ships an unsigned .dmg, which
      # users get past with right-click → Open the first time. Setting all five
      # of these turns signing on by itself — no change to this file:
      #
      #   APPLE_ID            Apple ID owning the developer account
      #   APPLE_TEAM_ID       the 10-character Team ID
      #   APPLE_APP_PASSWORD  an app-specific password, for notarization
      #   APPLE_CERT_P12      the Developer ID certificate, base64-encoded
      #   APPLE_CERT_PASSWORD the password for that .p12
      #
      # Needs a paid ($99/yr) Apple Developer account. Windows is a separate
      # OV/EV certificate, and OV ones trip SmartScreen anyway until they build
      # reputation — which is why that side stays unsigned regardless.
      - name: Sign and notarize
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -p actions build.keychain
          codesign --deep --force --options runtime \
            --sign "Developer ID Application: $APPLE_TEAM_ID" \
            dist/Overshare.app
          xcrun notarytool store-credentials profile \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Package the .dmg
        run: ./packaging/make_dmg.sh "${{ steps.version.outputs.value }}"

      - name: Staple the notarization
        if: env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          xcrun notarytool submit \
            "dist/Overshare-${{ steps.version.outputs.value }}.dmg" \
            --keychain-profile profile --wait
          xcrun stapler staple \
            "dist/Overshare-${{ steps.version.outputs.value }}.dmg"

      # A stable name as well as the versioned one, so the website can link
      # straight at the file instead of asking the API which file to link to.
      - name: Add a stable-named copy
        run: cp "dist/Overshare-${{ steps.version.outputs.value }}.dmg" dist/Overshare-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  windows:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] && echo "value=${ref#v}" >> "$GITHUB_OUTPUT" \
                                              || echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the build
        # Otherwise the packaged app has no idea what it is, and the in-app
        # update check has nothing to compare against.
        #
        # Passed through the environment rather than a temp file: Git Bash on
        # the Windows runner and the Python it launches do not agree on where
        # /tmp is, so a file written by one wasn't there for the other.
        shell: python
        env:
          OVERSHARE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          import os, pathlib
          v = os.environ["OVERSHARE_VERSION"]
          p = pathlib.Path("overshare/version.py")
          t = p.read_text()
          new = f'VERSION = "{v}"'
          assert 'VERSION = "0.0.0-dev"' in t, "placeholder already replaced?"
          p.write_text(t.replace('VERSION = "0.0.0-dev"', new))
          print("stamped:", new)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      # Inno Setup wants a real .ico; the repo only carries a .png.
      - name: Make the Windows icon
        run: |
          python -c "from PIL import Image; im = Image.open('assets/icon.png').convert('RGBA'); im.save('assets/icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build the app
        run: pyinstaller packaging/Overshare.spec --noconfirm

      # Inno Setup ships on the runner image but isn't always on PATH, so find
      # ISCC.exe before falling back to installing it.
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ }
            if ($candidates) {
              $iscc = $candidates[0]
            } else {
              choco install innosetup -y --no-progress
              $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            }
          } else {
            $iscc = $iscc.Source
          }
          Write-Host "Using $iscc"
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }

      - name: Add a stable-named copy
        shell: bash
        run: cp "dist/Overshare-Setup-${{ steps.version.outputs.value }}.exe" dist/Overshare-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  release:
    name: Publish the release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4        # for the extension/ folder

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The browser extension ships as a plain zip — it loads unpacked, so this
      # is just the folder, named for the release and also with a stable name
      # the website can link straight at.
      - name: Package the browser extension
        run: |
          cd extension
          zip -r "../Overshare-extension-${GITHUB_REF_NAME#v}.zip" . -x '*/.DS_Store'
          cp "../Overshare-extension-${GITHUB_REF_NAME#v}.zip" ../Overshare-extension.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-installer/*.exe
            Overshare-extension*.zip
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — download the `.dmg`, drag Overshare to Applications.
            The first time, **right-click the app → Open** and confirm: the app
            isn't signed by a paid Apple developer account, so a normal
            double-click gets refused.

            > **Updating? macOS drops the Accessibility permission every time.**
            > Same reason — an unsigned build's fingerprint changes, so the
            > saved permission stops matching. Switching the entry off and on
            > does **not** work; it points at the build you replaced. Go to
            > **System Settings → Privacy & Security → Accessibility**, select
            > Overshare, press **−**, then **+** and add it back. Overshare
            > reopens itself once it notices. Until then updates still send,
            > they just stop naming the channel or file you're in.

            **Windows** — download and run the `Setup.exe`. SmartScreen may warn
            you; click **More info → Run anyway**. Installs for your user only,
            so there's no admin prompt.

            Then click the 💌 in your menu bar (or tray) → **Settings…**

            ---

            ### Browser extension (optional)

            The desktop app sees what app and page you're on. The extension adds
            what happens **inside** a page — a like, a Not Interested, a reel, an
            add-to-cart — for X, Instagram, YouTube, Reddit, TikTok, Spotify,
            Netflix, Amazon and LinkedIn. It posts to the same channel.

            1. Download **`Overshare-extension.zip`** below and unzip it.
            2. Open `chrome://extensions` (Chrome, Brave, Edge, Arc, Opera).
            3. Turn on **Developer mode**, click **Load unpacked**, pick the
               unzipped folder.
            4. Click the extension → **Options** → paste the same Discord webhook
               → switch on the sites and actions you want. Everything is off
               until you turn it on.

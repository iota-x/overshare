<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overshare — browser</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>Overshare <span class="dim">— browser</span></h1>
    <p class="lead">
      Shares the in-page things the desktop app can't see. Everything is off
      until you switch it on — a fresh install sends nothing.
    </p>

    <section class="card">
      <label class="row master">
        <span>
          <b>Sharing on</b>
          <small>The one switch. Off = nothing leaves the browser, whatever else is ticked.</small>
        </span>
        <input type="checkbox" id="enabled" />
      </label>

      <label class="row stack">
        <span><b>Discord webhook URL</b>
          <small>The same channel your desktop app posts to. Stored only in this browser.</small>
        </span>
        <input type="url" id="webhook" placeholder="https://discord.com/api/webhooks/…" />
      </label>
      <div class="row btns">
        <button id="test">Send a test card</button>
        <span id="teststatus" class="dim"></span>
      </div>
    </section>

    <section id="sites"></section>

    <section class="card">
      <label class="row">
        <span><b>Also capture in incognito windows</b>
          <small>Off by default. Private windows stay private unless you say otherwise.</small>
        </span>
        <input type="checkbox" id="captureIncognito" />
      </label>
      <p class="dim tiny">
        DM and message screens are never captured. This reads only public
        actions — a like, a vote, what you're watching — never message contents.
      </p>
    </section>

    <p id="saved" class="saved">saved</p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>

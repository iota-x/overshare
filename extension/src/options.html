<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overshare — browser</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <header class="masthead">
      <span class="lamp" id="lamp" aria-hidden="true"></span>
      <div class="word">
        <h1>OVERSHARE</h1>
        <p class="tag">the quiet line to your channel</p>
      </div>
    </header>

    <!-- Signature: the master switch is going "on air". -->
    <label class="onair" id="onair">
      <span class="onair-state">
        <b id="stateword">off air</b>
        <small id="statesub">nothing is going out</small>
      </span>
      <input type="checkbox" id="enabled" />
    </label>

    <section class="block">
      <p class="eyebrow">your channel</p>
      <input type="url" id="webhook" placeholder="discord webhook url" spellcheck="false" />
      <div class="testline">
        <button id="test">Test the line</button>
        <span id="teststatus"></span>
      </div>
      <p class="note">The same place your desktop app posts. Kept on this computer only.</p>
    </section>

    <section class="block">
      <p class="eyebrow">what goes out</p>
      <div id="sites"></div>
    </section>

    <section class="block">
      <label class="line">
        <span class="line-label">private windows
          <small>left alone unless you allow it</small>
        </span>
        <input type="checkbox" id="captureIncognito" />
      </label>
      <p class="note">Messages and DMs are never read — only public taps like a like, a vote, or what you're watching.</p>
    </section>

    <p id="saved" class="saved" role="status">saved</p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
